<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CarePlus Medical Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2E2C; --teal:#1B6F6A; --teal-d:#12514D; --mint:#E4F0EC; --paper:#F6F9F7;
  --line:#D3E2DD; --muted:#5C7572; --amber:#C9871F; --rose:#B04A46; --white:#fff;
  --bg:var(--paper); --card:var(--white); --text:var(--ink);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3,.brand{font-family:"Bricolage Grotesque",Inter,sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.12;margin:0}
h1{font-size:clamp(2rem,5vw,3.2rem)}
h2{font-size:clamp(1.4rem,3vw,2rem)}
h3{font-size:1.05rem}
p{margin:0}
a{color:inherit}
img{max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(246,249,247,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-size:1.1rem}
.logo{width:32px;height:32px;border-radius:10px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
nav{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
nav button{padding:8px 12px;border-radius:8px;color:var(--muted);font-size:.92rem}
nav button:hover{background:var(--mint);color:var(--ink)}
.btn{background:var(--teal);color:#fff;padding:11px 20px;border-radius:10px;font-weight:600;display:inline-block}
.btn:hover{background:var(--teal-d)}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--mint)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:8px}
/* hero */
.hero{padding:72px 0 56px;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.hero p.lede{color:var(--muted);margin-top:18px;max-width:52ch;font-size:1.05rem}
.hero .cta{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap}
.hours{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.hours div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.hours div:last-child{border:0}
.hours span:last-child{color:var(--muted)}
section.block{padding:44px 0;border-top:1px solid var(--line)}
.sub{color:var(--muted);margin-top:8px}
.grid{display:grid;gap:16px;margin-top:24px}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:left}
.card .dot{width:38px;height:38px;border-radius:12px;background:var(--mint);color:var(--teal-d);display:grid;place-items:center;font-size:1.1rem;margin-bottom:12px}
.card p{color:var(--muted);font-size:.92rem;margin-top:6px}
.doc{display:flex;gap:14px;align-items:flex-start}
.ava{width:54px;height:54px;border-radius:14px;background:var(--mint);color:var(--teal-d);display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
.ava svg{width:100%;height:100%;display:block}
.photo{width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--mint);margin-bottom:14px}
.photo svg{width:100%;height:100%;display:block}
.logo svg{width:22px;height:22px;display:block}
.hero-art{width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--mint)}
.hero-art svg{width:100%;height:auto;display:block}
.map{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--mint)}
.map svg{width:100%;height:auto;display:block}
.dot svg{width:20px;height:20px;display:block}
.tag{display:inline-block;background:var(--mint);color:var(--teal-d);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600}
.fee{font-weight:600;margin-top:10px;font-size:.92rem}
/* booking */
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 8px}
.steps li{list-style:none;font-size:.78rem;color:var(--muted);border:1px solid var(--line);padding:5px 11px;border-radius:999px;background:var(--card)}
.steps li.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.steps li.done{background:var(--mint);color:var(--teal-d);border-color:var(--mint)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:16px}
.pick{width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card);margin-bottom:10px;display:flex;gap:12px;align-items:center}
.pick:hover{border-color:var(--teal);background:var(--mint)}
.pick.sel{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.dates{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.date{flex:none;width:84px;text-align:center;border:1px solid var(--line);border-radius:12px;padding:12px 6px;background:var(--card)}
.date b{display:block;font-size:1.3rem;font-family:"Bricolage Grotesque",sans-serif}
.date small{color:var(--muted)}
.date.sel{background:var(--teal);color:#fff;border-color:var(--teal)}
.date.sel small{color:#dff0ec}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.slot{border:1px solid var(--line);border-radius:10px;padding:11px 6px;text-align:center;background:var(--card);font-size:.92rem}
.slot:hover:not([disabled]){border-color:var(--teal)}
.slot.sel{background:var(--teal);color:#fff;border-color:var(--teal)}
.slot[disabled]{background:#EEF1F0;color:#93A6A3;text-decoration:line-through;cursor:not-allowed}
label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px}
input,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit}
.phone-group{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.phone-group .cc{display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--mint);color:var(--teal-d);font-weight:600;font-size:.92rem;white-space:nowrap}
.phone-group input{border:0;border-radius:0;background:transparent}
.phone-group input:focus{outline:none}
.err{color:var(--rose);font-size:.82rem;margin-top:5px}
.rows div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:.94rem}
.rows div:last-child{border:0}
.rows span:first-child{color:var(--muted)}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.ok{text-align:center;padding:36px 20px}
.ok .id{font-family:"Bricolage Grotesque",sans-serif;font-size:1.6rem;background:var(--mint);color:var(--teal-d);display:inline-block;padding:8px 18px;border-radius:12px;margin:14px 0}
.check{width:58px;height:58px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:1.6rem;margin:0 auto}
.note{background:var(--mint);border-radius:12px;padding:14px 16px;font-size:.88rem;color:var(--teal-d);margin-top:18px;text-align:left}
/* admin */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.8rem;margin-top:4px}
.kpi span{color:var(--muted);font-size:.85rem}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:20px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.9rem}
th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.78rem;color:var(--muted);font-weight:600}
tr:last-child td{border:0}
.st{border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:600;border:1px solid}
.st.confirmed{background:var(--mint);color:var(--teal-d);border-color:#BBD9D2}
.st.pending{background:#FBF1DE;color:var(--amber);border-color:#EED9AF}
.st.cancelled{background:#F8E9E8;color:var(--rose);border-color:#EDCECD}
.st.completed{background:#ECEFEE;color:var(--muted);border-color:var(--line)}
.st.noshow{background:#F3EAF5;color:#7A5E8C;border-color:#DCCDE2}
.btn.danger{background:var(--rose)}
.btn.danger:hover{background:#933b37}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pwpanel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--mint);border-radius:12px;padding:12px 14px;margin-top:8px}
.pwpanel label{width:100%;margin:0}
.pwpanel input{flex:1;min-width:180px;max-width:260px}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:.92rem}
.atabs{display:flex;gap:6px;margin:20px 0 6px;border-bottom:1px solid var(--line)}
.atabs button{padding:10px 4px;color:var(--muted);font-weight:600;font-size:.92rem;border-bottom:2px solid transparent;margin-right:18px}
.atabs button.on{color:var(--teal-d);border-color:var(--teal)}
.docrow{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}
.docrow .ava{width:46px;height:46px;border-radius:12px;overflow:hidden;flex:none}
.docrow .meta{flex:1;min-width:190px}
.docrow .meta small{color:var(--muted)}
.docrow.off{opacity:.55}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.formgrid .full{grid-column:1/-1}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.daychip{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.85rem;background:var(--card)}
.daychip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
@media(max-width:700px){.formgrid{grid-template-columns:1fr}}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.calgrid .dow{text-align:center;font-size:.78rem;color:var(--muted);font-weight:600;padding:4px 0}
.calcell{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;position:relative}
.calcell.pad{background:transparent;border-color:transparent}
.calcell.today{border-color:var(--teal)}
.calcell.sel{background:var(--teal);border-color:var(--teal)}
.calcell.sel .dnum,.calcell.sel .badge{color:#fff}
.calcell .dnum{font-size:.88rem;font-weight:600}
.calcell .badge{font-size:.72rem;background:var(--mint);color:var(--teal-d);border-radius:999px;padding:1px 7px;margin-top:auto}
.calcell.sel .badge{background:rgba(255,255,255,.25)}
.daylist{margin-top:18px}
.daycard{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
@media(max-width:600px){.calcell .dnum{font-size:.78rem}.calcell .badge{padding:0 5px;font-size:.66rem}}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.filterbar input[type="text"],.filterbar input[type="date"]{width:auto;min-width:160px}
.filterbar select{width:auto}
.recpanel{background:var(--mint);border-radius:14px;padding:16px;margin-top:10px}
.recpanel label{margin-top:10px}
.recnote{display:flex;gap:8px;margin-top:10px}
.lookup{max-width:440px;margin:48px auto}
.lookup .row{display:flex;gap:8px}
#lid{text-transform:uppercase}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:.86rem;margin-top:30px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hide{display:none!important}
@media(max-width:820px){
  .hero{grid-template-columns:1fr;padding:40px 0 32px;gap:28px}
  .g3{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .bar{height:auto;padding:10px 0;flex-wrap:wrap}
  nav{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
html[dir="rtl"] body{font-family:Cairo,Inter,system-ui,sans-serif}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] .brand{font-family:Cairo,sans-serif;letter-spacing:0}
html[dir="rtl"] .hero,html[dir="rtl"] .doc,html[dir="rtl"] .pick,html[dir="rtl"] .docrow,html[dir="rtl"] .daycard,html[dir="rtl"] .kpi span,html[dir="rtl"] .rows div{text-align:right}
html[dir="rtl"] .rows div{flex-direction:row-reverse}
html[dir="rtl"] .phone-group{flex-direction:row-reverse}
html[dir="rtl"] .steps{flex-direction:row-reverse}
html[dir="rtl"] nav{margin-left:0;margin-right:auto}
html[dir="rtl"] .nav2{flex-direction:row-reverse}
html[dir="rtl"] input,html[dir="rtl"] select{text-align:right}
html[dir="rtl"] #lid{text-align:center}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1A19;--card:#152624;--line:#26403D;--text:#E7F1EE;--ink:#E7F1EE;--muted:#9BB3AF;--mint:#1C3532;--paper:#0E1A19}
  :root:not([data-theme="light"]) header{background:rgba(14,26,25,.92)}
  :root:not([data-theme="light"]) .slot[disabled]{background:#1B2B29;color:#6C8783}
}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand"><span class="logo" id="logo"></span> <span id="nv-brand">CarePlus Medical Clinic</span></div>
    <nav>
      <button id="nv-home" onclick="go('home')">Home</button>
      <button id="nv-doctors" onclick="go('doctors')">Doctors</button>
      <button id="nv-lookup" onclick="go('lookup')">My appointment</button>
      <button id="nv-doclogin" onclick="go(loggedDoctor?'docportal':'doclogin')">Doctor login</button>
      <button id="nv-patlogin" onclick="go(loggedPatient?'patientportal':'patientlogin')">Patient login</button>
      <button id="nv-admin" onclick="go('admin')">Admin</button>
      <button id="nv-book" class="btn sm" onclick="startBooking()">Book appointment</button>
      <button id="nv-lang" class="btn ghost sm" onclick="toggleLang()">العربية</button>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer class="wrap">
  <span id="nv-footaddr">CarePlus Medical Clinic · 12 Nile Street, Maadi, Cairo · +20 100 123 4567</span>
  <span id="nv-footnote">Demo preview — sample data only</span>
</footer>

<script>
/* ---------- demo data ---------- */
const CLINIC={name:"CarePlus Medical Clinic",address:"12 Nile Street, Maadi, Cairo",phone:"+20 100 123 4567"};
const specialties=[
  {id:1,name:"Dermatology",icon:"✦",desc:"Skin, hair and nail care for all ages.",active:true},
  {id:2,name:"Dentistry",icon:"◈",desc:"Cleaning, fillings, whitening and check-ups.",active:true},
  {id:3,name:"Cardiology",icon:"♥",desc:"Heart check-ups, ECG and follow-up care.",active:true}
];
// days: 0=Sun .. 6=Sat
const doctors=[
  {id:1,name:"Dr. Ahmed Hassan",spec:1,exp:12,fee:400,bio:"Consultant dermatologist, laser and acne treatment.",
   days:[6,0,1,2,3],start:"16:00",end:"21:00",slot:30,breakStart:"18:30",breakEnd:"19:00",active:true},
  {id:2,name:"Dr. Mona Saleh",spec:2,exp:8,fee:300,bio:"Dentist focused on cosmetic and preventive care.",
   days:[0,2,4],start:"10:00",end:"15:00",slot:30,breakStart:"12:00",breakEnd:"12:30",active:true},
  {id:3,name:"Dr. Karim Fouad",spec:3,exp:15,fee:500,bio:"Cardiologist, ECG and hypertension follow-up.",
   days:[1,3,6],start:"17:00",end:"20:00",slot:30,breakStart:null,breakEnd:null,active:true}
];
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=new Date(); today.setHours(0,0,0,0);
const plus=n=>{const d=new Date(today);d.setDate(d.getDate()+n);return d};
// one patient already registered + booked appointments
const appointments=[
  {id:"APT-"+iso(plus(2)).replace(/-/g,"")+"-1025",patient:"Mona Adel",phone:"+20 111 222 3344",doctor:1,date:iso(plus(2)),time:"17:00",fee:400,status:"confirmed"},
  {id:"APT-"+iso(today).replace(/-/g,"")+"-1008",patient:"Mona Adel",phone:"+20 111 222 3344",doctor:2,date:iso(today),time:"11:00",fee:300,status:"pending"}
];
const notifications=[]; // {apptId,type,recipient,status,scheduledAt,sentAt}
const patientRecords={}; // phone -> {chronic,meds,notes:[{date,by,text}]}
function recordFor(phone){if(!patientRecords[phone])patientRecords[phone]={chronic:"",meds:"",notes:[]};return patientRecords[phone]}
const REMINDER_HOURS={val:5};
function digitsOnly(p){return p.replace(/[^\d]/g,"")}
function waLink(phone,text){return "https://wa.me/"+digitsOnly(phone)+"?text="+encodeURIComponent(text)}
function normalizeEgyptPhone(local){
  let d=String(local).replace(/\D/g,"");
  if(d.startsWith("20"))d=d.slice(2);
  if(d.startsWith("0"))d=d.slice(1);
  return "+20 "+(d.length>=10?d.slice(0,3)+" "+d.slice(3,6)+" "+d.slice(6):d);
}
function confirmationText(a,d){
  return `*Appointment Confirmed*\n${CLINIC.name}\n\n`+
  `Patient: ${a.patient}\n`+
  `Doctor: ${d.name}\n`+
  `Specialty: ${spec(d.spec).name}\n`+
  `Date: ${nice(a.date)}\n`+
  `Time: ${t12(a.time)}\n`+
  `Fee: ${money(a.fee)}\n`+
  `ID: ${a.id}\n\n`+
  `Location: ${CLINIC.address}\n`+
  `Phone: ${CLINIC.phone}`;
}
function reminderTime(a){
  const dt=new Date(a.date+"T"+a.time+":00");
  dt.setHours(dt.getHours()-REMINDER_HOURS.val);
  return dt;
}
function removeReminder(apptId){for(let i=notifications.length-1;i>=0;i--){if(notifications[i].apptId===apptId&&notifications[i].type==="Appointment reminder")notifications.splice(i,1)}}
function addReminder(a){const r=reminderTime(a);notifications.push({apptId:a.id,type:"Appointment reminder",recipient:a.phone,status:r<new Date()?"skipped (past)":"scheduled",scheduledAt:r,sentAt:null})}
function scheduleNotifications(a){
  notifications.push({apptId:a.id,type:"Booking confirmation",recipient:a.phone,status:"ready",scheduledAt:null,sentAt:null});
  addReminder(a);
}
const locale=()=>LANG==="ar"?"ar-EG":"en-GB";
function fmtDT(d){return d?d.toLocaleString(locale(),{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"—"}
const SEED=JSON.stringify({doctors,appointments,specialties});
appointments.forEach(a=>{if(a.status!=="cancelled")scheduleNotifications(a)});

/* ---------- auto-save in this browser ---------- */
const STORE_KEY="careplus_demo_v1";
let storageOk=true;
function saveState(){
  try{
    localStorage.setItem(STORE_KEY,JSON.stringify({v:1,doctors,appointments,notifications,lead:REMINDER_HOURS.val,lang:LANG,records:patientRecords,specialties}));
  }catch(e){storageOk=false}
}
function loadState(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw)return false;
    const st=JSON.parse(raw);
    if(!st||st.v!==1||!Array.isArray(st.doctors)||!Array.isArray(st.appointments)||!Array.isArray(st.notifications))return false;
    doctors.length=0; st.doctors.forEach(d=>doctors.push(d));
    appointments.length=0; st.appointments.forEach(a=>appointments.push(a));
    if(Array.isArray(st.specialties)){specialties.length=0; st.specialties.forEach(sp=>specialties.push(sp));}
    Object.keys(patientRecords).forEach(k=>delete patientRecords[k]);
    if(st.records)Object.keys(st.records).forEach(k=>patientRecords[k]=st.records[k]);
    notifications.length=0;
    st.notifications.forEach(n=>notifications.push(Object.assign({},n,{scheduledAt:n.scheduledAt?new Date(n.scheduledAt):null,sentAt:n.sentAt?new Date(n.sentAt):null})));
    REMINDER_HOURS.val=st.lead||5;
    if(st.lang)LANG=st.lang;
    return true;
  }catch(e){storageOk=false;return false}
}
function resetDemo(){

/* ---------- slot engine (demo version) ---------- */
function slotsFor(d,dateStr){
  const mins=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
  const fmt=v=>String(Math.floor(v/60)).padStart(2,"0")+":"+String(v%60).padStart(2,"0");
  const out=[];
  for(let t=mins(d.start);t+d.slot<=mins(d.end);t+=d.slot){
    if(d.breakStart&&t<mins(d.breakEnd)&&t+d.slot>mins(d.breakStart))continue;
    const time=fmt(t);
    const taken=appointments.some(a=>a.doctor===d.id&&a.date===dateStr&&a.time===time&&a.status!=="cancelled");
    out.push({time,taken});
  }
  return out;
}
function datesFor(d){
  const out=[];
  for(let i=0;i<14;i++){const dt=plus(i);if(d.days.includes(dt.getDay()))out.push(iso(dt))}
  return out.slice(0,8);
}

  if(!rescheduleTime){rescheduleErr="Pick a time slot.";render();return}
  const clash=appointments.some(x=>x.id!==a.id&&x.doctor===a.doctor&&x.date===rescheduleDate&&x.time===rescheduleTime&&x.status!=="cancelled");
  if(clash){rescheduleErr="That slot was just taken. Pick another.";render();return}
  a.date=rescheduleDate;a.time=rescheduleTime;
  removeReminder(a.id);
  if(a.status==="pending"||a.status==="confirmed")addReminder(a);
  rescheduleId=null;rescheduleErr="";render();
}
function reschedulePanel(){

  const d=doc(a.doctor);

  const list=slotsFor(d,rescheduleDate).filter(sl=>!(sl.taken&&!(a.date===rescheduleDate&&a.time===sl.time)));
  return `<div id="reschedpanel" class="panel" style="margin-top:18px">
    <h3>Reschedule ${a.id}</h3>
    <p class="sub">${a.patient} · ${d.name} · currently ${nice(a.date)} at ${t12(a.time)}</p>

      <button class="date ${rescheduleDate===ds?"sel":""}" onclick="pickRescheduleDate('${ds}')">

    <div class="slots" style="margin-top:14px">${list.map(sl=>`
      <button class="slot ${rescheduleTime===sl.time?"sel":""}" ${sl.taken?"disabled":""} onclick="pickRescheduleTime('${sl.time}')">${t12(sl.time)}${sl.taken?"<br><small>Booked</small>":""}</button>`).join("")}</div>
    ${rescheduleErr?`<div class="err">${rescheduleErr}</div>`:""}

function calendarTab(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const first=new Date(y,m,1), startDow=first.getDay(), days=new Date(y,m+1,0).getDate();
  const act=appointments.filter(a=>a.status!=="cancelled");
  const countFor=ds=>act.filter(a=>a.date===ds).length;
  const cells=[];
  for(let i=0;i<startDow;i++)cells.push(null);
  for(let d=1;d<=days;d++)cells.push(d);
  const monthLabel=calMonth.toLocaleDateString(locale(),{month:"long",year:"numeric"});
  const dayAppts=act.filter(a=>a.date===calSelected).sort((a,b)=>a.time.localeCompare(b.time));
  return `
    <div class="calhead">
      <button class="btn ghost sm" onclick="prevMonth()">← Prev</button>
      <h3>${monthLabel}</h3>
      <button class="btn ghost sm" onclick="nextMonth()">Next →</button>
    </div>
    <div class="calgrid">
      ${dayLabels().map(l=>`<div class="dow">${l}</div>`).join("")}
      ${cells.map(d=>{
        if(!d)return `<div class="calcell pad"></div>`;
        const ds=iso(new Date(y,m,d)), c=countFor(ds), isToday=ds===iso(today), isSel=ds===calSelected;
        return `<button class="calcell ${isToday?"today":""} ${isSel?"sel":""}" onclick="selectCalDate('${ds}')">
          <span class="dnum">${d}</span>${c?`<span class="badge">${c}</span>`:""}</button>`;
      }).join("")}
    </div>
    <div class="daylist">
      <h3>${nice(calSelected)}</h3>
      ${dayAppts.length?dayAppts.map(a=>{const d=doc(a.doctor);return `
        <div class="daycard">
          <div><b>${t12(a.time)}</b> · ${a.patient}<br><small style="color:var(--muted)">${d.name} · ${spec(d.spec).name}</small></div>
          <span class="st ${a.status}">${stl(a.status)}</span>
        </div>`}).join(""):`<div class="empty">No appointments on this day.</div>`}
    </div>`;
}

function esc(x){return x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
const STRINGS_RE=STRINGS.map(([en,ar])=>[new RegExp(esc(en),"g"),ar]);
function translate(html){if(LANG!=="ar")return html;let out=html;STRINGS_RE.forEach(([re,ar])=>out=out.replace(re,ar));return out}
const CHROME_AR={
  "nv-home":"الرئيسية","nv-doctors":"الأطباء","nv-lookup":"حجزي","nv-doclogin":"دخول الطبيب",

const CHROME_EN={
  "nv-home":"Home","nv-doctors":"Doctors","nv-lookup":"My appointment","nv-doclogin":"Doctor login",
  "nv-admin":"Admin","nv-patlogin":"Patient login","nv-book":"Book appointment","nv-lang":"العربية",
  "nv-footaddr":"CarePlus Medical Clinic · 12 Nile Street, Maadi, Cairo · +20 100 123 4567",
  "nv-footnote":"Demo preview — sample data only"
};
function updateChrome(){
  document.documentElement.setAttribute("dir",LANG==="ar"?"rtl":"ltr");
  document.documentElement.setAttribute("lang",LANG==="ar"?"ar":"en");
  const map=LANG==="ar"?CHROME_AR:CHROME_EN;
  Object.keys(map).forEach(id=>{const e=el(id);if(e)e.textContent=map[id]});
}
function render(){
  const html = view==="home"?home():view==="doctors"?doctorsPage():view==="book"?book():view==="done"?done():view==="lookup"?lookup():view==="doclogin"?doctorLogin():view==="docportal"?(loggedDoctor?doctorPortal():doctorLogin()):view==="patientlogin"?patientLogin():view==="patientportal"?(loggedPatient?patientPortal():patientLogin()):adminView();
  el("app").innerHTML = translate(html);
  updateChrome();
  saveState();
}
render();
